# VPS 배포용: 앱 + Redis + Caddy(HTTPS 자동 발급/갱신)를 한 서버에서 실행
# 사용법은 docs/DEPLOY_VPS.md 참고. 필요한 값은 .env 에 넣는다 (.env.vps.example 참고).
# 서버에서는 .env 의 COMPOSE_FILE 설정 덕분에 `docker compose up -d --build` 만 입력하면 이 파일이 사용된다.
# (저장소의 docker-compose.yml 은 로컬 단독 실행용 — Redis 가 없어 그대로는 앱이 뜨지 않는다.)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # 같은 compose 네트워크 안의 redis 서비스로 접속 (외부에 포트를 열지 않음)
      REDIS_URL: redis://:${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}@redis:6379
      # 광고를 켤 때만 .env 에 값을 넣는다 (비어 있으면 광고 관련 요청 없음)
      ADSENSE_PUBLISHER_ID: ${ADSENSE_PUBLISHER_ID:-}
      ADSENSE_LOBBY_SLOT: ${ADSENSE_LOBBY_SLOT:-}
      ADSENSE_GAME_END_SLOT: ${ADSENSE_GAME_END_SLOT:-}
    depends_on:
      redis:
        condition: service_healthy
    # 앱 포트는 호스트에 공개하지 않는다. 외부 접근은 caddy 만 통해서.
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 방/접속자 데이터는 서버 시작 시 정리되므로 디스크 저장이 필요 없다 (--save "" --appendonly no)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}
    # redis 도 외부에 공개하지 않는다 (ports 없음)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?.env 에 DOMAIN 을 설정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서 보관 (삭제하지 마세요)
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
